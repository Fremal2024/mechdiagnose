services:
  - type: web
    name: mechdiagnose-backend
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn mechdiagnose.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mechdiagnose-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: your-backend-url.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend-url.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://your-frontend-url.onrender.com